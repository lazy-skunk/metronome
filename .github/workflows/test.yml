name: Vite+ Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "lts"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - run: vp test
